name: Release

# INACTIVE until the owner acts: this workflow only runs when a tag named v* is pushed, and
# the PyPI publish job additionally requires the repository variable RELEASE_ENABLED=true and
# the protected `pypi` environment. Nothing here has ever been run. See
# docs/release-checklist.md for the exact owner steps (and which are blocking).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Third-party actions are pinned by major version; SHA pinning is a documented follow-up
# (docs/security-review-v0.1.md, SO-02).

jobs:
  checks:
    name: checks ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version="$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - run: uv run --no-project python scripts/check_dist.py dist
      - name: Smoke test the wheel in a clean venv
        run: |
          uv venv "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv" dist/*.whl
          uv run --no-project python scripts/smoke_wheel.py "$RUNNER_TEMP/smoke-venv"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: draft GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # only this job can create the (draft) release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # A DRAFT: the owner reviews the notes and publishes it by hand.
      - name: Create the draft release with the sdist and wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft --verify-tag \
            --title "CursorFleet ${GITHUB_REF_NAME}" \
            --notes "Draft. Copy the matching section of CHANGELOG.md here before publishing. Unofficial: not affiliated with or endorsed by Anysphere or Cursor."

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build
    # Kill switch: set the repository variable RELEASE_ENABLED=true to allow publishing.
    if: vars.RELEASE_ENABLED == 'true'
    environment:
      name: pypi # protected environment: configure required reviewers in the repository settings
      url: https://pypi.org/project/cursorfleet/
    permissions:
      id-token: write # OIDC token for Trusted Publishing; granted to this job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
