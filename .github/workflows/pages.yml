# Public docs site (Zensical → GitHub Pages).
#
# Build runs on pull requests and on main. Deploy is off by default so a push
# cannot publish. The owner must later: (1) enable Pages with source
# "GitHub Actions", (2) set the repository variable PAGES_ENABLED=true.
# Official Pages actions: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
# Zensical build: https://zensical.org/docs/publish-your-site/

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job starts read-only. Only deploy elevates.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run zensical build --clean
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    # Kill switch: unset/false keeps this workflow build-only.
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
