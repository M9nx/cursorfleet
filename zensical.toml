# Zensical keeps every setting under [project] (not MkDocs-style top-level keys).
# Official keys: https://zensical.org/docs/setup/basics/
# Explicit nav (sections and titled entries): https://zensical.org/docs/setup/navigation/
# Footer: copyright, social links, prev/next (navigation.footer). No custom templates.
# Stock light/dark toggle: https://zensical.org/docs/setup/colors/

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project]
site_name = "CursorFleet"
site_url = "https://m9nx.github.io/cursorfleet/"
site_description = "Passive Cursor hooks + local TUI to observe agent teams. Observe-only, pre-alpha, unofficial."
site_author = "M9nx"
docs_dir = "public-docs"
site_dir = "site"
extra_css = [
  "stylesheets/site-brand.css",
]
repo_url = "https://github.com/M9nx/cursorfleet"
copyright = "MIT · CursorFleet by <a href=\"https://github.com/M9nx\" target=\"_blank\" rel=\"noopener\">M9nx</a> · unofficial, not affiliated with Anysphere"
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Concepts" = [
    { "Sessions" = "concepts/sessions.md" },
    { "Agents and events" = "concepts/agents-and-events.md" },
    { "Worktrees" = "concepts/worktrees.md" },
  ] },
  { "CLI" = [
    { "init" = "cli/init.md" },
    { "status" = "cli/status.md" },
    { "doctor" = "cli/doctor.md" },
    { "validate" = "cli/validate.md" },
  ] },
  { "TUI" = [
    { "Overview" = "tui/overview.md" },
    { "Current status" = "tui/current-status.md" },
  ] },
  { "Privacy and security" = "privacy-and-security.md" },
  { "Known limitations" = "known-limitations.md" },
  { "Contributing" = "contributing.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
custom_dir = "public-docs/overrides"
logo = "assets/logo-circle.png"
favicon = "assets/favicon-32.png"
features = ["navigation.footer"]

[project.plugins.meta]
enabled = true
meta_file = ".meta.yml"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/M9nx/cursorfleet"
name = "Source on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/download"
link = "/cursorfleet/getting-started/installation/"
name = "Installation"

[[project.extra.social]]
icon = "fontawesome/solid/rocket"
link = "/cursorfleet/getting-started/quickstart/"
name = "Quickstart"

[[project.extra.social]]
icon = "fontawesome/solid/triangle-exclamation"
link = "/cursorfleet/known-limitations/"
name = "Known limitations"

[[project.extra.social]]
icon = "fontawesome/solid/code-branch"
link = "/cursorfleet/contributing/"
name = "Contributing"
